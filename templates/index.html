<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Criticalog Control Tower</title>

<link href="https://cdn.jsdelivr.net/npm/3.3/dist/css/bootstrap.min.css

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
    background:#edf2f7;
    font-family:Segoe UI,Tahoma,sans-serif;
}

.top-header{
    background:#0f172a;
    color:white;
    padding:15px 25px;
    border-radius:15px;
    margin-bottom:20px;
}

.top-header h2{
    margin:0;
}

.kpi-card{
    border-radius:12px;
    color:white;
    padding:12px;
    text-align:center;
    height:90px;
}

.kpi-card h3{
    margin:0;
    font-size:24px;
    font-weight:bold;
}

.kpi-card p{
    margin:0;
    font-size:13px;
}

.delivered{
    background:#198754;
}

.transit{
    background:#0d6efd;
}

.pending{
    background:#dc3545;
}

.ofd{
    background:#fd7e14;
}

.section-card{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.progress{
    height:28px;
}

#progressBar{
    font-weight:600;
}

.status-delivered{
    background:#d1e7dd !important;
}

.status-transit{
    background:#cfe2ff !important;
}

.status-pending{
    background:#f8d7da !important;
}

.status-ofd{
    background:#fff3cd !important;
}

.table th{
    position:sticky;
    top:0;
    z-index:10;
}

textarea{
    resize:vertical;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<div class="top-header">
<h2>🚚 Criticalog Control Tower</h2>
<div>Bulk AWB Tracking Dashboard</div>
</div>

<div class="row g-2 mb-3">

<div class="col-md-3">
<div class="kpi-card delivered">
<h3 id="deliveredCount">0</h3>
<p>Delivered</p>
</div>
</div>

<div class="col-md-3">
<div class="kpi-card transit">
<h3 id="transitCount">0</h3>
<p>In Transit</p>
</div>
</div>

<div class="col-md-3">
<div class="kpi-card ofd">
<h3 id="ofdCount">0</h3>
<p>Out For Delivery</p>
</div>
</div>

<div class="col-md-3">
<div class="kpi-card pending">
<h3 id="pendingCount">0</h3>
<p>Pickup Pending</p>
</div>
</div>

</div>

<div class="section-card mb-3">

<div class="row">

<div class="col-md-8">

<label class="form-label">
Paste AWBs (One Per Line)
</label>

<textarea
id="awbs"
class="form-control"
rows="8"
placeholder="CAF777800004083"></textarea>

</div>

<div class="col-md-4">

<label class="form-label">
Upload Excel
</label>

<input
type="file"
id="excelFile"
class="form-control mb-3"
accept=".xlsx,.xls">

<button
class="btn btn-primary w-100 mb-2"
onclick="trackAll()">

Track All

</button>

<button
class="btn btn-success w-100"
onclick="exportTable()">

Export Excel

</button>

</div>

</div>

</div>

<div class="mb-3">

<div class="progress">

<div
id="progressBar"
class="progress-bar progress-bar-striped progress-bar-animated"
style="width:0%">

0%

</div>

</div>

</div>

<div class="mb-3">

<input
type="text"
id="searchBox"
class="form-control"
placeholder="Search AWB..."
onkeyup="searchTable()">

</div>

<div class="section-card">

<div class="table-responsive">

<table
id="resultTable"
class="table table-bordered table-hover">

<thead class="table-dark">

<tr>
<th>AWB</th>
<th>Status</th>
<th>Origin</th>
<th>Destination</th>
<th>Pickup Date</th>
<th>EDD</th>
<th>Delivered Date</th>
</tr>

</thead>

<tbody id="results">

</tbody>

</table>

</div>

</div>

</div>

<script>

async function trackAll(){

let awbs =
document.getElementById("awbs")
.value
.split("\n")
.map(x=>x.trim())
.filter(x=>x);

if(awbs.length===0){
alert("Enter AWBs");
return;
}

const progress =
document.getElementById("progressBar");

progress.style.width="5%";
progress.innerHTML="Starting...";

const response =
await fetch("/track",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
awbs:awbs
})

});

const data =
await response.json();

const tbody =
document.getElementById("results");

tbody.innerHTML="";

let delivered=0;
let transit=0;
let pending=0;
let ofd=0;

data.forEach((item,index)=>{

let cls="";

if(item.status==="Delivered"){
delivered++;
cls="status-delivered";
}
else if(item.status==="In Transit"){
transit++;
cls="status-transit";
}
else if(item.status==="Pickup Pending"){
pending++;
cls="status-pending";
}
else if(item.status==="Out For Delivery"){
ofd++;
cls="status-ofd";
}

tbody.innerHTML += `
<tr class="${cls}">
<td>${item.awb || ''}</td>
<td>${item.status || ''}</td>
<td>${item.origin || ''}</td>
<td>${item.destination || ''}</td>
<td>${item.pickup_date || ''}</td>
<td>${item.edd || ''}</td>
<td>${item.delivered_date || ''}</td>
</tr>
`;

let pct =
Math.round(
((index+1) / data.length) * 100
);

progress.style.width =
pct + "%";

progress.innerHTML =
pct + "%";

});

document.getElementById("deliveredCount").innerHTML =
delivered;

document.getElementById("transitCount").innerHTML =
transit;

document.getElementById("ofdCount").innerHTML =
ofd;

document.getElementById("pendingCount").innerHTML =
pending;

progress.innerHTML="Completed";

}

function searchTable(){

let filter =
document.getElementById("searchBox")
.value
.toUpperCase();

let rows =
document.querySelectorAll(
"#resultTable tbody tr"
);

rows.forEach(row=>{

let awb =
row.cells[0].innerText.toUpperCase();

row.style.display =
awb.includes(filter)
? ""
: "none";

});

}

function exportTable(){

let table =
document.getElementById("resultTable");

let wb =
XLSX.utils.table_to_book(table);

XLSX.writeFile(
wb,
"Criticalog_Report.xlsx"
);

}

document.getElementById("excelFile")
.addEventListener("change",function(e){

const file =
e.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload=function(evt){

const data =
new Uint8Array(evt.target.result);

const workbook =
XLSX.read(
data,
{type:"array"}
);

const sheet =
workbook.Sheets[
workbook.SheetNames[0]
];

const rows =
XLSX.utils.sheet_to_json(
sheet,
{header:1}
);

let awbs=[];

rows.forEach(row=>{

if(row[0]){
awbs.push(row[0]);
}

});

document.getElementById("awbs").value =
awbs.join("\n");

};

reader.readAsArrayBuffer(file);

});

</script>

</body>
</html>
